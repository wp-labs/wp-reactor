[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Elastic-2.0"
version = "2.1.0" # @gxl:set(version)

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
smol_str = { version = "0.3", features = ["serde"] }
foldhash = "0.2"
serde_json = "1.0"
toml = "1.1"
winnow = "1.0"
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
log = "0.4"
regex = "1"
chrono = "0.4"
hex = "0.4"
md5 = { package = "md-5", version = "0.10" }
sha1 = "0.11"
glob = "0.3"
wildmatch = "2"
tokio = { version = "1", features = ["sync"] }
async-broadcast = "0.7"
wp-connector-api =  "0.13"
wp-core-connectors = "0.9"
wp-model-core = "0.10"
wf-connector-api = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
orion-error = { version = "0.8", features = ["derive", "serde_json", "toml", "tracing"] }
derive_more = { version = "2.1", features = ["from"] }
thiserror = "2.0"
sha2 = "0.11"
csv = "1.4"
jumo-derive = "0.1"
# named-query layer that the published 0.15.x dropped (external()/external_exists
# backend). Requirement must track the local version or the [patch.crates-io]
# below silently falls back to a published wp-knowledge. Bump together with
# the in-workspace checkout (wfusion/wp-knowledge).
wp-knowledge = "0.18"

# In-workspace override: build against the wfusion/wp-knowledge checkout so the
# KnowDB refresh service can be developed & tested together with the reactor.
