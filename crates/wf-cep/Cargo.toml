[package]
name = "wf-cep"
version.workspace = true
edition.workspace = true
license.workspace = true

# wf-cep（P4-A 同步执行核）：承载引擎同步执行面（cep/event_bridge/executor/…）。
# 依赖墙：允许 arrow 纯数据面；禁止 tokio / async / 网络 / 持久化 IO。
# wf-engine 经 shim 模块重导出，公开路径不变。
[dependencies]
wf-lang = { path = "../wf-lang" }
regex = { workspace = true }
orion-error = { workspace = true }
moju-derive = { workspace = true }
arrow = { workspace = true }
chrono = { workspace = true }
foldhash = { workspace = true }
hex = { workspace = true }
md5 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
smol_str = { workspace = true }
serde_json = { workspace = true }
