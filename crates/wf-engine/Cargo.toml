[package]
name = "wf-engine"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wf_engine"

[dependencies]
wf-config = { path = "../wf-config" }
wf-lang = { path = "../wf-lang" }
wp-connector-api = { workspace = true }
wp-model-core = { workspace = true }
arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
foldhash = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
log = { workspace = true }
orion-error = { workspace = true }
derive_more = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
md5 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
wildmatch = { workspace = true }
chrono = { workspace = true }
moju-derive = { workspace = true }
crossbeam-skiplist = "0.1"
# Same version crossbeam-skiplist defers its unlinked nodes into; the window
# eviction paths drive its collector so evicted batches are destroyed now.
crossbeam-epoch = "0.9"

[dev-dependencies]
arrow = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[features]
mem_test = []
