mode = "daemon"
sinks = "sinks"
windows = "windows.toml"

[output]
time_format = "%Y-%m-%d %H:%M:%S%.3f"
time_zone = "utc"

[[sources]]
connect = "tcp_src"
name = "ingress_tcp"
addr = "127.0.0.1"
port = "9800"
framing = "len"
data_format = "arrow_framed"

# 可选：从 NDJSON 文件回放到指定 stream（一次性读完）。
# [[sources]]
# type = "file"
# name = "seed_auth"
# path = "pipeline/data/auth_events.ndjson"
# stream_tag = "syslog"
# data_format = "ndjson"

[runtime]
parse_parallelism = 2
rule_exec_timeout = "30s"
schemas = "count/schemas/*.wfs"
rules   = "count/rules/*.wfl"

[vars]
FAIL_THRESHOLD = "3"

[logging]
level = "info"
format = "plain"
file = "logs/wf-engine.log"
[logging.modules]
"wf_runtime::receiver" = "info"
