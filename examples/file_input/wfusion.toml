mode = "batch"
sinks = "../sinks"
windows = "windows.toml"
work_root = "."

[[sources]]
type = "file"
name = "seed_port_scan"
path = "data/port_scan.ndjson"
stream_tag = "netflow"
data_format = "ndjson"

[runtime]
parse_parallelism = 2
rule_exec_timeout = "30s"
schemas = "../distinct/schemas/*.wfs"
rules   = "../distinct/rules/*.wfl"

[logging]
level = "info"
format = "plain"
file = "logs/wf-engine.log"
